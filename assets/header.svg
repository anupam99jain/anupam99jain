<svg
  width="1200"
  height="300"
  viewBox="0 0 1200 300"
  fill="none"
  xmlns="http://www.w3.org/2000/svg"
>

  <defs>

    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="300" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0D1117"/>
      <stop offset="0.5" stop-color="#111827"/>
      <stop offset="1" stop-color="#0D1117"/>
    </linearGradient>

    <linearGradient id="accent" x1="120" y1="80" x2="1000" y2="230" gradientUnits="userSpaceOnUse">
      <stop stop-color="#00F5A0"/>
      <stop offset="0.5" stop-color="#00D9F5"/>
      <stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>

    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

  </defs>

  <!-- Background -->
  <rect
    width="1200"
    height="300"
    rx="24"
    fill="url(#bg)"
  />

  <!-- Decorative glow -->
  <circle
    cx="1050"
    cy="70"
    r="120"
    fill="#7C3AED"
    opacity="0.10"
    filter="url(#glow)"
  />

  <circle
    cx="150"
    cy="250"
    r="100"
    fill="#00D9F5"
    opacity="0.08"
    filter="url(#glow)"
  />

  <!-- Decorative lines -->
  <path
    d="M760 0L1200 180"
    stroke="url(#accent)"
    stroke-width="2"
    opacity="0.25"
  />

  <path
    d="M850 0L1200 140"
    stroke="url(#accent)"
    stroke-width="1"
    opacity="0.15"
  />

  <!-- Small grid -->
  <g opacity="0.08" stroke="#FFFFFF">
    <path d="M900 40H1160"/>
    <path d="M900 80H1160"/>
    <path d="M900 120H1160"/>
    <path d="M900 160H1160"/>
    <path d="M900 200H1160"/>

    <path d="M920 20V220"/>
    <path d="M960 20V220"/>
    <path d="M1000 20V220"/>
    <path d="M1040 20V220"/>
    <path d="M1080 20V220"/>
    <path d="M1120 20V220"/>
  </g>

  <!-- Main heading -->
  <text
    x="80"
    y="125"
    font-family="Arial, Helvetica, sans-serif"
    font-size="64"
    font-weight="700"
    fill="#FFFFFF"
  >
    ANUPAM JAIN
  </text>

  <!-- Accent line -->
  <rect
    x="82"
    y="145"
    width="260"
    height="4"
    rx="2"
    fill="url(#accent)"
  />

  <!-- Subtitle -->
  <text
    x="82"
    y="190"
    font-family="Arial, Helvetica, sans-serif"
    font-size="24"
    fill="#A7B0BE"
  >
    C++ • Systems • Competitive Programming • ML
  </text>

  <!-- Small status -->
  <circle
    cx="91"
    cy="230"
    r="6"
    fill="#00F5A0"
  />

  <text
    x="108"
    y="237"
    font-family="Arial, Helvetica, sans-serif"
    font-size="17"
    fill="#8B949E"
  >
    Building • Learning • Solving
  </text>

</svg>